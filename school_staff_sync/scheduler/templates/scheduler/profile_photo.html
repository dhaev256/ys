{% extends 'scheduler/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm p-4 p-md-5">
            <h3 class="fw-bold mb-2">Profile Photo</h3>
            <p class="text-muted mb-4">Upload a clear photo. This will appear on your profile and schedules.</p>

            {% if form.instance.photo %}
            <div class="text-center mb-4">
                <img src="{{ form.instance.photo.url }}"
                     alt="Current photo"
                     class="rounded-circle shadow"
                     style="width:120px;height:120px;object-fit:cover;">
                <p class="text-muted small mt-2">Current photo</p>
            </div>
            {% endif %}

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex gap-3 mt-4 pt-3 border-top">
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">Save Photo</button>
                    <a href="{% url 'home' %}" class="btn btn-light px-4 fw-semibold text-muted">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
