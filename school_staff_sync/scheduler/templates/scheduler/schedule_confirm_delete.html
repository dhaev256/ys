{% extends 'scheduler/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm p-4 p-md-5 text-center">
            <div class="mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 rounded-circle mb-3" style="width: 60px; height: 60px;">
                    <span class="fs-3 text-danger">!</span>
                </div>
                <h3 class="fw-bold mb-2">Delete Schedule</h3>
                <p class="text-muted">
                    Are you sure you want to delete <strong>"{{ schedule.subject }}"</strong> on <strong>{{ schedule.date }}</strong>? 
                    This action cannot be undone.
                </p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2 justify-content-center">
                    <button type="submit" class="btn btn-danger px-4 fw-semibold">Yes, Delete</button>
                    <a href="{% url 'schedule_list' %}" class="btn btn-light px-4 fw-semibold text-muted">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
