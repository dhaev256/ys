{% extends 'scheduler/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm p-4 p-md-5">
            <h3 class="fw-bold mb-1">Change Password</h3>
            <p class="text-muted mb-4">Please enter your old password and then enter and confirm your new password.</p>

            <form method="post" novalidate>
                {% csrf_token %}
                {{ form|crispy }}

                <div class="d-flex gap-3 mt-4 pt-3 border-top">
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">Update Password</button>
                    <a href="{% url 'home' %}" class="btn btn-light px-4 fw-semibold text-muted">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
